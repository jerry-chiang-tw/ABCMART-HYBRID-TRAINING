<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HYBRID TRAINING｜ABC-MART × OTC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Archivo+Black&display=swap');

  :root{
    --lime: #d9f04c;
    --lime-dk: #a9bc2e;
    --ink: #17181a;
    --ink-soft: #2a2b2e;
    --paper: #fbfbf5;
    --sub: #5b5c55;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--lime);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .noise-layer{
    position: fixed; inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:multiply;
    z-index: 50;
  }

  /* ---------- LOADER ---------- */
  body.loading{ overflow:hidden; height:100vh; }

  .loader{
    position:fixed; inset:0;
    background: var(--lime);
    z-index: 9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .loader-stage{
    position:relative;
    width: 42vw;
    max-width: 260px;
    aspect-ratio: 1 / 1;
  }
  .loader-char{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transform: scale(.92);
    transition: opacity .25s ease, transform .25s ease;
  }
  .loader-char.active{
    opacity:1;
    transform: scale(1);
  }
  .loader-label{
    margin-top: 28px;
    font-family:'Archivo Black', sans-serif;
    letter-spacing:0.22em;
    font-size: 13px;
    color: var(--ink);
  }
  .loader-dots{
    display:flex;
    gap:6px;
    margin-top:14px;
  }
  .loader-dots span{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--ink);
    opacity:.25;
  }
  .loader-dots span.on{ opacity:1; }

  /* ---------- BANNER ---------- */
  .banner-wrap{
    width: 100%;
    line-height: 0;
  }
  .banner-wrap img{
    width: 100%;
    display:block;
  }

  /* ---------- ABOUT ---------- */
  .about{
    max-width: 760px;
    margin: 9vh auto 6vh;
    padding: 0 6vw;
    text-align:center;
  }
  .about p{
    font-size: clamp(9px, 2.3vw, 18px);
    line-height: 1.85;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .about p b{ color: var(--ink); }

  .ig-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:22px;
    padding: 10px 20px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration:none;
    transition: background .2s ease, color .2s ease;
  }
  .ig-link:hover{
    background: var(--ink);
    color: var(--lime);
  }

  /* ---------- FORM SECTION ---------- */
  .form-section{
    padding: 0 6vw 10vh;
    display:flex;
    flex-direction: column;
    align-items:center;
  }

  .form-card{
    width:100%;
    max-width: 720px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.35);
    overflow:hidden;
    position:relative;
  }

  .form-card::before{
    content:"";
    display:block;
    height:8px;
    background: repeating-linear-gradient(
      -45deg,
      var(--ink), var(--ink) 10px,
      var(--lime) 10px, var(--lime) 20px
    );
  }

  .form-card-head{
    padding: 34px 34px 10px;
  }
  .form-card-head h2{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(22px, 3vw, 30px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .form-card-head p{
    margin:0;
    color: var(--sub);
    font-size: 14px;
    line-height:1.7;
  }

  iframe.gform{
    width: 100%;
    min-height: 900px;
    border: none;
    display:block;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding: 4vh 6vw 6vh;
    color: var(--sub);
    font-size:12px;
    letter-spacing:0.04em;
  }

  @media (max-width: 640px){
    .banner-wrap{ width: 100%; }
  }
</style>
</head>
